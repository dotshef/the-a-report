<!doctype html>
<!-- @dsCard group="UI Kit — Mobile App" name="UI Kit · Mobile App" subtitle="iOS app — home, transfer, success, 26주적금 (interactive)" viewport="1400x900" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>KakaoBank Mobile · UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body {
    margin: 0;
    background: #FAFAFA;
    font-family: "Pretendard", system-ui, sans-serif;
  }
  .stage {
    min-height: 100vh;
    padding: 40px 32px 80px;
    box-sizing: border-box;
  }
  .header {
    max-width: 1400px;
    margin: 0 auto 32px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    color: #A3A3A3;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .title {
    font-size: 32px;
    font-weight: 700;
    color: #1E1E1E;
    margin-top: 6px;
    letter-spacing: -0.02em;
  }
  .sub {
    font-size: 15px;
    color: #A3A3A3;
    margin-top: 8px;
    max-width: 720px;
    line-height: 1.5;
  }
  .grid {
    display: flex;
    gap: 48px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .device-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .device-label {
    font-size: 12px;
    font-weight: 600;
    color: #1E1E1E;
  }
  .device-label .muted { color: #A3A3A3; font-weight: 500; }
  .interactive-hint {
    font-size: 11px;
    color: #A3A3A3;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="TransferScreen.jsx"></script>
<script type="text/babel" src="SuccessScreen.jsx"></script>
<script type="text/babel" src="SavingsScreen.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

function Frame({ children, label, sub }) {
  return (
    <div className="device-wrap">
      <IOSDevice width={360} height={780}>{children}</IOSDevice>
      <div className="device-label">{label} <span className="muted">{sub}</span></div>
    </div>
  );
}

function InteractiveDevice() {
  const [screen, setScreen] = useState('home');
  let content;
  if (screen === 'home')    content = <HomeScreen onTransfer={()=>setScreen('transfer')} onSavings={()=>setScreen('savings')}/>;
  if (screen === 'transfer')content = <TransferScreen onBack={()=>setScreen('home')} onConfirm={()=>setScreen('success')}/>;
  if (screen === 'success') content = <SuccessScreen onDone={()=>setScreen('home')}/>;
  if (screen === 'savings') content = <SavingsScreen onBack={()=>setScreen('home')}/>;

  return (
    <div className="device-wrap">
      <IOSDevice width={360} height={780}>
        <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
          <div style={{ flex: 1, overflow: 'auto', paddingTop: 44 }}>{content}</div>
          {screen === 'home' && <BottomTabs active="home"/>}
        </div>
      </IOSDevice>
      <div className="device-label">Click-thru prototype <span className="muted">· tap "이체" to start</span></div>
      <div className="interactive-hint">홈 → 이체 → 확인 → 성공 · 26주적금 진입</div>
    </div>
  );
}

function App() {
  return (
    <div className="stage">
      <div className="header">
        <div className="eyebrow">UI Kit · Mobile App</div>
        <div className="title">KakaoBank · iOS</div>
        <div className="sub">
          Hi-fi recreation of the KakaoBank mobile app surfaces. Components live in <code>Components.jsx</code>; each screen is its own file. Mascot illustrations on the debit card and 26주적금 widget are reserved slots — drop in real Kakao Friends art for production.
        </div>
      </div>

      <div className="grid">
        <InteractiveDevice/>

        <Frame label="Home" sub="· account list + 26주적금 widget">
          <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <div style={{ flex: 1, overflow: 'auto', paddingTop: 44 }}>
              <HomeScreen/>
            </div>
            <BottomTabs active="home"/>
          </div>
        </Frame>

        <Frame label="Transfer · 이체" sub="· amount entry">
          <div style={{ paddingTop: 44, height: '100%' }}>
            <TransferScreen/>
          </div>
        </Frame>

        <Frame label="Success · 이체 완료" sub="· spring check">
          <div style={{ paddingTop: 44, height: '100%' }}>
            <SuccessScreen/>
          </div>
        </Frame>

        <Frame label="26주적금" sub="· savings detail">
          <div style={{ paddingTop: 44, height: '100%' }}>
            <SavingsScreen/>
          </div>
        </Frame>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
