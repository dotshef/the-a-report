<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Symbol Lockups" subtitle="On yellow / black / white — nothing else" viewport="700x200" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body{margin:0;}</style>
</head>
<body>
<div class="card" style="">

<div style="display:flex; gap:18px;">
  <div style="flex:1; background:#FFE300; padding:24px; border-radius:12px; text-align:center;">
    <img src="../assets/kakaobank-symbol.svg" style="width:60px; height:60px;" alt="">
    <div style="font-size:10px; color:#1E1E1E; opacity:0.7; margin-top:8px; font-family:Pretendard;">on Yellow</div>
  </div>
  <div style="flex:1; background:#1E1E1E; padding:24px; border-radius:12px; text-align:center;">
    <div style="width:60px; height:60px; background:#FFE300; border-radius:14px; margin:0 auto;"></div>

  </div>
  <div style="flex:1; background:#fff; padding:24px; border-radius:12px; box-shadow: inset 0 0 0 1px #E6E6E6; text-align:center;">
    <img src="../assets/kakaobank-symbol.svg" style="width:60px; height:60px;" alt="">
    <div style="font-size:10px; color:#1E1E1E; opacity:0.5; margin-top:8px; font-family:Pretendard;">on White</div>
  </div>
</div>
<div style="margin-top:10px; font-size:11px; color:#A3A3A3;">Symbol renders only on solid Yellow, Black, or White. Any other background is guideline-forbidden.</div>

</div>
