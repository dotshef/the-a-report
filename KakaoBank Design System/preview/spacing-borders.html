<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Borders" subtitle="1px #CCCCCC default · 1px #E6E6E6 dividers" viewport="700x190" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body{margin:0;}</style>
</head>
<body>
<div class="card" style="">

<div style="display:flex; gap:18px;">
  <div style="flex:1;">
    <div style="background:#fff; padding:20px; border-radius:12px; box-shadow: inset 0 0 0 1px #CCCCCC;">
      <div style="font-size:14px; font-weight:600; color:#1E1E1E;">Card / input</div>
      <div style="font-size:12px; color:#A3A3A3; margin-top:4px;">1px #CCCCCC</div>
    </div>
    <div class="token-label">--border-default</div>
  </div>
  <div style="flex:1;">
    <div style="background:#fff; border-radius:12px; box-shadow: inset 0 0 0 1px #E6E6E6; overflow:hidden;">
      <div style="padding:14px 18px; border-bottom:1px solid #E6E6E6; font-size:13px; color:#1E1E1E;">행 1</div>
      <div style="padding:14px 18px; border-bottom:1px solid #E6E6E6; font-size:13px; color:#1E1E1E;">행 2</div>
      <div style="padding:14px 18px; font-size:13px; color:#1E1E1E;">행 3</div>
    </div>
    <div class="token-label">--border-subtle · #E6E6E6 · list dividers</div>
  </div>
  <div style="flex:1;">
    <input type="text" placeholder="계좌번호" style="width:100%; box-sizing:border-box; padding:14px 16px; border-radius:12px; border:1.5px solid #1E1E1E; background:#fff; font-size:14px; font-family:Pretendard; color:#1E1E1E; outline:none;" value="3333-01-" />
    <div class="token-label">Focus · 1.5px #1E1E1E (never yellow)</div>
  </div>
</div>

</div>
</body>
</html>
