<!doctype html>
<!-- @dsCard group="Components" name="Components · Inputs" subtitle="Default · focus 1.5px black · error 1.5px red" viewport="700x170" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body{margin:0;}</style>
</head>
<body>
<div class="card" style="">

<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px;">
  <div>
    <input type="text" placeholder="이름을 입력하세요" style="width:100%; box-sizing:border-box; padding:14px 16px; border-radius:12px; border:1px solid #CCCCCC; background:#fff; font-size:16px; font-family:Pretendard; color:#1E1E1E; outline:none;">
    <div class="token-label">Default · 1px #CCCCCC</div>
  </div>
  <div>
    <input type="text" value="김카뱅" style="width:100%; box-sizing:border-box; padding:13.5px 16px; border-radius:12px; border:1.5px solid #1E1E1E; background:#fff; font-size:16px; font-family:Pretendard; color:#1E1E1E; outline:none;">
    <div class="token-label">Focus · 1.5px #1E1E1E</div>
  </div>
  <div>
    <input type="text" value="3333-99-9" style="width:100%; box-sizing:border-box; padding:13.5px 16px; border-radius:12px; border:1.5px solid #E02000; background:#fff; font-size:16px; font-family:Pretendard; color:#1E1E1E; outline:none;">
    <div style="font-size:12px; color:#E02000; margin-top:6px; font-family:Pretendard;">계좌번호를 다시 확인해주세요</div>
    <div class="token-label">Error · 1.5px #E02000</div>
  </div>
</div>

</div>
</body>
</html>
