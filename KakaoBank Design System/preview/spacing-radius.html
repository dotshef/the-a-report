<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Radii" subtitle="12px default · 16 comfort · pill for badges" viewport="700x170" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>body{margin:0;}</style>
</head>
<body>
<div class="card" style="">

<div style="display:flex; gap:18px; align-items:flex-end;">
  
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#FFE300; border-radius:8px;"></div>
      <div class="token-label">8px</div>
      <div class="token-meta">--radius-tight</div>
      <div style="font-size:10px; color:#A3A3A3; margin-top:2px;">chips</div>
    </div>
  
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#FFE300; border-radius:12px;"></div>
      <div class="token-label">12px</div>
      <div class="token-meta">--radius-default</div>
      <div style="font-size:10px; color:#A3A3A3; margin-top:2px;">buttons · cards · avatars</div>
    </div>
  
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#FFE300; border-radius:16px;"></div>
      <div class="token-label">16px</div>
      <div class="token-meta">--radius-comfort</div>
      <div style="font-size:10px; color:#A3A3A3; margin-top:2px;">fill cards · debit card</div>
    </div>
  
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#FFE300; border-radius:20px;"></div>
      <div class="token-label">20px</div>
      <div class="token-meta">--radius-sheet</div>
      <div style="font-size:10px; color:#A3A3A3; margin-top:2px;">bottom sheet</div>
    </div>
  
    <div style="text-align:center;">
      <div style="width:72px; height:72px; background:#FFE300; border-radius:9999px;"></div>
      <div class="token-label">9999</div>
      <div class="token-meta">--radius-pill</div>
      <div style="font-size:10px; color:#A3A3A3; margin-top:2px;">badges · dots</div>
    </div>
  
</div>

</div>
</body>
</html>
